name: Update HK Weekend Map

on:
  schedule:
    - cron: '0 1 * * 1'   # Monday 01:00 UTC = Monday 09:00 HKT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scrape and generate map
        run: |
          set -euo pipefail
          python3 hk_weekend_map.py --out index.html
          echo "Generated index.html ($(wc -c < index.html) bytes)"

      - name: Commit and push refreshed map
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js icon-192.png icon-512.png
          git diff --staged --quiet \
            || git commit -m "chore: refresh weekend map $(date -u '+%Y-%m-%d')"
          git push
