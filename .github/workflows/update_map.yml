name: Update HK Weekend Map

on:
  schedule:
    - cron: '0 23 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape art-mate.net and generate map
        run: python3 hk_weekend_map.py --out index.html

      - name: Commit and push refreshed map
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js icon-192.png icon-512.png
          git diff --staged --quiet \
            || git commit -m "chore: refresh weekend map $(date -u '+%Y-%m-%d')"
          git push
