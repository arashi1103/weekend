name: Update HK Weekend Map

on:
  schedule:
    - cron: '0 1 * * 1'   # Monday 01:00 UTC = Monday 09:00 HKT
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scrape and generate map
        run: |
          set -euo pipefail
          python3 hk_weekend_map.py --out index.html
          echo "Generated $(wc -c < index.html) bytes"

      - name: Commit updated map back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet \
            || git commit -m "chore: refresh weekend map $(date -u '+%Y-%m-%d')"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
